# This Cargo.toml is here to let externals tools (IDEs, etc.) know that this is
# a Rust project. Your extensions dependencies should be added to the Cargo.toml
# in the ext/ directory.

[workspace]
members = ["./ext/pdf_dioxide"]
resolver = "2"

[profile.release]
# The `bundle gem --ext=rust` scaffold keeps full debug info in release builds;
# with pdf_oxide's ~1000-crate dependency tree that made each native .so ~100 MB
# (a two-Ruby-version cross gem was 227 MB). Drop debuginfo but keep the symbol
# table so panic backtraces still show function names.
debug = false
strip = "debuginfo"
